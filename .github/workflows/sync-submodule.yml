name: Sync guided-coding-workshop submodule

# Keeps the guided-coding-workshop submodule pointer at the latest commit on
# its main branch. Runs instantly when guided-coding-workshop notifies us via
# repository_dispatch (see its notify-parent.yml workflow), and can also be
# run manually. Commits and pushes directly to main -- no PR, per design.
on:
  repository_dispatch:
    types: [guided-coding-workshop-updated]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workshops
        uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update submodule to latest main
        run: |
          git submodule update --init --remote --merge guided-coding-workshop

      - name: Commit and push if the pointer moved
        run: |
          if git diff --quiet -- guided-coding-workshop; then
            echo "Submodule already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add guided-coding-workshop
          NEW_SHA=$(git -C guided-coding-workshop rev-parse --short HEAD)
          git commit -m "chore: sync guided-coding-workshop submodule to ${NEW_SHA}"
          git push
